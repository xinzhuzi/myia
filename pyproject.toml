[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myssia"
version = "0.0.3"
description = "AI-native intelligence hub — config-driven fetch, classify, analyze, push. 说需求,AI 做其余。"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "xinzhuzi"}]
dependencies = [
    "httpx[socks]>=0.27",
    "selectolax>=0.3.21",
    "PyYAML>=6.0.1",
    "APScheduler>=3.10,<4",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "keyring>=25",
    # RSS 提取(10-03-news-rss):extract.type=rss 的 feed 解析(RSS1/2/Atom、
    # CDATA、编码坑全覆盖);BSD-2 纯 Python 轻依赖(sgmllib3k),零重依赖。
    "feedparser>=6",
    # 分类引擎已拆为独立发行(任务 10-01-v10-classifier-pypi);固定版本范围,
    # 语义由 src/myssia/classify 兼容 shim 保留,import 路径不变。
    # 版本窗随版本序列归零重定为 0.0 序列(2026-10-03 主人令从 0.0.1 重新开始)。
    "myssia-classifier>=0.0.1,<0.1",
]

[project.optional-dependencies]
crawl4ai = ["crawl4ai"]
scrapling = ["scrapling"]
firecrawl = ["firecrawl-py"]
skyvern = ["skyvern"]
# SimpleX 出站(10-03-messaging-w3-longtail 组二):WS 客户端库 websockets 是
# 可选依赖(simplex.py 惰性 import,缺装发送/发现报 dependency_missing 并附
    # 安装命令 `pip install 'myssia[simplex]'`);纯 Python 轻依赖,uv.lock 已随
# firecrawl-py 传递锁定 17.1。
simplex = ["websockets>=12"]
llm = ["openai>=1.30"]
# 看图(10-03-image-input):双引擎 OCR = ocrmac(macOS Vision,MIT)+
# rapidocr-onnxruntime(Apache-2.0,内置模型零下载);显式含 llm 的 openai
# (VisionClient 复用 AsyncOpenAI 模式)。体积影响 ~37MB 下载(onnxruntime
# 20.5MB + rapidocr 14.2MB),见任务档 design 依赖节。
# huggingface-hub(10-03-vision-v2):应用内下载 mlx-community 系 MLX 权重
# (vision/models.py snapshot_download,惰性 import);带 tqdm 传递依赖。
# ocrmac 平台标记(10-04-windows-build F1):macOS Vision 独占,Windows/Linux
# 无 wheel(传递链 pyobjc 全 macosx wheel,uv.lock 实读;CI run 37117015528
# Windows sdist 构建炸)。macOS 装配与无标记逐字节等价(marker 恒真)。
vision = ["ocrmac>=1.0; sys_platform == 'darwin'", "rapidocr-onnxruntime>=1.3", "openai>=1.30", "huggingface-hub>=0.23"]
# 表格还原(10-05-table-restore,R1/R3):rapid-table(RapidAI 家族 onnx 表格
# 结构还原,SLANET-plus 模型首用从 modelscope 下载 6.8MB 到包目录,SHA256
# 校验——3.x 轮并不内置模型,README 措辞已过期,3.0.2 轮实读);单元格文字
# 走 rapidocr-onnxruntime(vision extras 同栈复用,wrapper 显式喂 ocr_results
# 绕开其内置新版 rapidocr 通道);tqdm 是 rapid-table 3.0.2 轮的隐性 import
# (未声明进 requires-dist,main.py:11 实读),显式补上防裸装炸 import。
table = ["rapid-table>=3.0.2,<4", "rapidocr-onnxruntime>=1.3", "tqdm>=4"]
# 正文兜底(10-05-trafilatura-impl):static_html 引擎 extract 缺失/规则跑空时的
# opt-in 单页正文抽取(开关 MYIA_EXTRACT_FALLBACK=1,缺省关零行为差);惰性
# import,缺装时兜底能力结构化降级不拦核心(①回落 extract_required、②维持零条)。
# 'selectolax<1' 钉版不可省:自由解析装 1.0.0 撞 Modest 解析器移除墙,trafilatura
# 自身走 lxml 不硬依赖 selectolax,钉版保护的是 MYIA extract_html 面(评估档 §4)。
trafilatura = ["trafilatura>=2.3,<3", "selectolax<1"]
# 统一推送(10-05-push-apprise):Apprise 一库(caronc/apprise,MIT)通吃
# ~160 个长尾推送目标(Pushover/Gotify/Bark/discord-webhook 变体等),
# 一个 extras 解锁;通道 target 走凭据引用,值 = Apprise 原生 URL 串
# (逗号/换行分隔多目标)。同 trafilatura 先例:不进核心依赖、不进 all、
# requirements-lock.txt(桌面锁)不进——缺装时发送期结构化
# apprise_unavailable + doctor finding apprise_not_installed 带安装命令
# (不惊扰未配置用户,没配该通道 = 正常态零提示)。钉版 >=1.9,<2:
# 1.9 起本通道消费面(Apprise 单例 add/notify)稳定,<2 防破坏性漂移。
apprise = ["apprise>=1.9,<2"]
# Telegram 用户线(10-06-telegram-telethon B4):Telethon(LonamiWebs,
# MIT,~11k★)账号 session 走 MTProto 读任意已加入群(bot 进不去的群);
# 链接者铁律——只依赖不改其源码。惰性 import(telethon_line.py 依赖门),
# 缺装 = 结构化 dependency_missing 带安装命令,不影响 bot 线与其余流水
# 线。钉版 >=1.36,<2:1.36 起本线消费面(TelegramClient connect/sign_in/
# iter_messages/add_event_handler)稳定,<2 防 v2 破坏性漂移。桌面锁随
# llm extras 同款手法扩 --extra telethon(装机态 serve 双线起);另设
# 置页组件卡同步收录(crawl4ai 组件轨判例,缺装可见可装)。
# python-socks(2026-10-08 G2 固化,主人手装过的件入锁):Telethon 走
# SOCKS/HTTP 代理连接的官方推荐件(import python_socks;非 telethon 传递
# 依赖,必须显式声明)。钉版 >=1.2.4,<3:1.2.4 起 sync+asyncio 双形态
# 稳定,<3 防破坏性漂移。桌面锁同轮固化(增量 4 轮→5 轮)。
telethon = ["telethon>=1.36,<2", "python-socks>=1.2.4,<3"]
all = ["crawl4ai", "scrapling", "firecrawl-py", "skyvern", "openai>=1.30", "huggingface-hub>=0.23"]

[project.scripts]
myssia = "myssia.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.workspace]
members = ["myssia-classifier"]

# myssia-classifier(目录同名)不发布到 PyPI 前按 workspace 成员解析;发布后可切注册表源。
[tool.uv.sources]
myssia-classifier = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/myssia"]

# 双测试根(10-05-tests-module-grouping):主包 tests/ 已按 src/myssia 模块分组;
# myssia-classifier 的语义测试随独立包走自己的 tests/,根 testpaths 一并纳入,
# CI 单命令 `uv run --no-sync python -m pytest -q` 全量门禁不变。
[tool.pytest.ini_options]
testpaths = ["tests", "myssia-classifier/tests"]
