# Desktop Release — 桌面端打包流水线(PRD 10-02-v11-desktop-app:updater + 打包流水线;
# 10-04-windows-build:Windows 转正式交付目标 + latest.json 归聚单写者)。
# 触发:推送 v* tag;另留 workflow_dispatch 供演练——version 入参可指定 semver,
# 缺省回退 tauri.conf.json 的 version(分支名不是合法 semver,不能作版本)。
# 产物:macOS dmg + Windows msi(均为正式目标)→ 以 ASCII 名挂 GitHub Release;
# latest.json 由 release-finalize 归聚 job 单一产出(mac 条目恒在,windows 条目
# 按产物存在与否自动并入)。
#
# ── updater 签名体系(详见 desktop/UPDATER.md)────────────────────────────────
#   私钥/密码绝不入库,仅经仓库 Secrets 注入,共 3 个:
#     TAURI_UPDATER_PUBKEY               公钥(替换 tauri.conf.json 的占位符)
#     TAURI_SIGNING_PRIVATE_KEY          签名私钥(npx tauri signer generate 产出)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码(未设密码则留空)
#   真实公钥 + createUpdaterArtifacts + 版本号经 `tauri build --config` 合并片
#   注入(基础 conf 保持占位符且不开签名,本地无钥构建不破)。Secrets 缺失时守卫
#   步骤直接中文报错,不产出半成品 release。
#
# ── 构建链 ────────────────────────────────────────────────────────────────────
#   npx tauri build --bundles <app,dmg|msi>(vite 前端 + 随包源码树 __pycache__ 清理
#   经 beforeBuildCommand 链;macOS 必须带 app 目标,updater 的 tar.gz/.sig 才会产出)。
#   Python 面(10-05-desktop-managed-py-env):myssia 源码/入口模块/requirements-lock
#   /runtime-manifest 以 tauri resources 随包(纯 Python,轻);运行时与第三方依赖
#   不进包,用户首跑在设置页「开始配置」下载安装(自管环境)。PyInstaller sidecar
#   冻结链已退役(desktop/build-sidecar.sh 档注;externalBin 已从 tauri.conf.json
#   移除),本流水线无 Python 预构建步骤,亦无需 uv。
#
# ── 已知边界 ─────────────────────────────────────────────────────────────────
#   * macOS 仅 aarch64(macos-14);x86_64/ universal 未配,需要时加 target 扩展;
#   * Windows 为正式交付目标(10-04-windows-build):msi 以 ASCII 名(myssia_<版本>
#     _x64.msi)挂 Release;latest.json 由 release-finalize 单写者产出,手工补条目
#     降级为归聚失败的应急路径(desktop/UPDATER.md 第三节);
#   * windows 失败=run 红(可见),但不牵连 macOS 发布与 mac 更新通道:归聚 job
#     以 always() + mac result 门执行,mac 条目照发,windows 仅条目/资产缺席;
#   * 未购代码签名证书:Windows 首装的 SmartScreen 放行口径见 README 安装节;
#     实机安装/升级冒烟清单在任务档(主人侧,不阻交付)。

name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "演练版本号(semver,如 0.0.2);缺省回退 tauri.conf.json 的 version"
        required: false

permissions:
  contents: write # 上传 Release 附件(gh-release)

jobs:
  macos-dmg:
    name: macOS dmg(aarch64,updater 主线)
    runs-on: macos-14 # arm64:当前唯一 mac 交付架构(与 dmg 单架构口径一致)
    steps:
      - uses: actions/checkout@v5

      - name: 守卫:updater secrets 必须已配置(配置方法见 desktop/UPDATER.md)
        env:
          HAS_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY != '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          miss=""
          [ "$HAS_PUBKEY" = "true" ] || miss="$miss TAURI_UPDATER_PUBKEY"
          [ "$HAS_KEY" = "true" ] || miss="$miss TAURI_SIGNING_PRIVATE_KEY"
          if [ -n "$miss" ]; then
            echo "::error::仓库缺少 updater secrets:$miss。请到 Settings → Secrets and variables → Actions 按 desktop/UPDATER.md 第二节配置(npx tauri signer generate 生成)。"
            exit 1
          fi
          echo "updater secrets OK(密码未配置视为空密码,签名时需一致)。"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache(desktop/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装桌面端 npm 依赖(@tauri-apps/cli)
        working-directory: desktop
        run: npm ci --no-fund --no-audit

      - name: 安装前端 npm 依赖(ui-src)
        working-directory: desktop/ui-src
        run: npm ci --no-fund --no-audit

      # 版本解析(dispatch 修复,10-04-windows-build F3):dispatch 入参 →
      # tag/分支名去 v → 非 semver(分支 dispatch 未传 version)回退
      # tauri.conf.json 的 version——分支名不是合法 semver,硬闯 tauri/WiX
      # 的版本解析必炸。解析一次写入 GITHUB_ENV,下游步骤直接用 $MYIA_VERSION。
      - name: 解析版本(dispatch 入参 → tag → tauri.conf.json 兜底)
        working-directory: desktop/src-tauri
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::warn::『$VERSION』非 semver(dispatch 未传 version?)——回退 tauri.conf.json 的 version。"
            VERSION="$(jq -r .version tauri.conf.json)"
          fi
          echo "MYIA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release conf version=$VERSION(ref=$REF_NAME,dispatch 入参=${INPUT_VERSION:-无})"

      - name: 写 updater 发布配置片(真实公钥 + createUpdaterArtifacts + 解析版本)
        working-directory: desktop/src-tauri
        # CI-only 文件:只存在于 runner 工作区,不入库(基础 conf 仍是占位符)
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          jq -n --arg v "$MYIA_VERSION" --arg p "$PUBKEY" \
            '{version: $v, bundle: {createUpdaterArtifacts: true},
              plugins: {updater: {pubkey: $p}}}' > tauri.release.conf.json
          echo "release conf merged (version $MYIA_VERSION)"

      - name: Tauri 构建(app+dmg + 签名更新包)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # --bundles 必须含 app:updater 的 tar.gz/.sig 只在 MacOsBundle 目标在列时
        # 产出(tauri-bundler 门逻辑),仅 dmg 会跳过更新包且随后把 .app 中间产物
        # 删掉 —— 归聚 job 读 .sig 必因缺席而红(v1.1 评审修复)。
        run: npx tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json

      # GitHub 会剥掉资产文件名里的非 ASCII 字符(世事.app.tar.gz→app.tar.gz、
      # 世事_1.1.1_aarch64.dmg→_1.1.1_aarch64.dmg,v1.1.1 实证)——latest.json 若
      # 指原名即 404。统一先复制成 ASCII 名(myssia.*),签名按字节验证不受改名影响。
      - name: 产物改 ASCII 名(GitHub 剥非 ASCII 资产名)
        run: |
          BUNDLE="desktop/src-tauri/target/release/bundle"
          cp "$BUNDLE/macos/世事.app.tar.gz"     "$BUNDLE/macos/myssia.app.tar.gz"
          cp "$BUNDLE/macos/世事.app.tar.gz.sig" "$BUNDLE/macos/myssia.app.tar.gz.sig"
          cp "$BUNDLE/dmg/"*"_aarch64.dmg"       "$BUNDLE/dmg/myssia_${MYIA_VERSION}_aarch64.dmg"

      # latest.json 生成已移至 release-finalize 归聚 job(单写者,10-04-windows-build
      # D6);本 job 只负责把 mac 签名交给归聚 job。
      - name: 上传 mac updater 签名(供 release-finalize 拼 latest.json)
        uses: actions/upload-artifact@v4
        with:
          name: mac-updater
          path: desktop/src-tauri/target/release/bundle/macos/myssia.app.tar.gz.sig
          if-no-files-found: error

      - name: 上传 Release 附件(dmg / 更新包+签名;release 创建者)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/src-tauri/target/release/bundle/dmg/myssia_*_aarch64.dmg
            desktop/src-tauri/target/release/bundle/macos/myssia.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/myssia.app.tar.gz.sig

  windows-msi:
    name: Windows msi(x86_64,正式交付目标)
    # 正式目标(10-04-windows-build):失败=run 红(可见),但不牵连 macOS 发布
    # 与 mac 更新通道——release-finalize 以 always() + mac result 门执行。
    # Release 挂载不在本 job(消双写者竞态),统一归 release-finalize。
    runs-on: windows-latest
    timeout-minutes: 60 # 挂死不得无限期拖住归聚 job 的 latest.json(grill R2-D6c)
    steps:
      - uses: actions/checkout@v5

      - name: 守卫:updater secrets 必须已配置(配置方法见 desktop/UPDATER.md)
        shell: bash
        env:
          HAS_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY != '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          miss=""
          [ "$HAS_PUBKEY" = "true" ] || miss="$miss TAURI_UPDATER_PUBKEY"
          [ "$HAS_KEY" = "true" ] || miss="$miss TAURI_SIGNING_PRIVATE_KEY"
          if [ -n "$miss" ]; then
            echo "::error::仓库缺少 updater secrets:$miss。请到 Settings → Secrets and variables → Actions 按 desktop/UPDATER.md 第二节配置(npx tauri signer generate 生成)。"
            exit 1
          fi
          echo "updater secrets OK(密码未配置视为空密码,签名时需一致)。"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache(desktop/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装桌面端 npm 依赖(@tauri-apps/cli)
        working-directory: desktop
        run: npm ci --no-fund --no-audit

      - name: 安装前端 npm 依赖(ui-src)
        working-directory: desktop/ui-src
        run: npm ci --no-fund --no-audit

      # 版本解析与 mac job 同款(dispatch 修复):分支 dispatch 未传 version 时
      # 回退 tauri.conf.json——分支名硬闯 WiX convert_version 必炸。
      - name: 解析版本(dispatch 入参 → tag → tauri.conf.json 兜底)
        working-directory: desktop/src-tauri
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::warn::『$VERSION』非 semver(dispatch 未传 version?)——回退 tauri.conf.json 的 version。"
            VERSION="$(jq -r .version tauri.conf.json)"
          fi
          echo "MYIA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release conf version=$VERSION(ref=$REF_NAME,dispatch 入参=${INPUT_VERSION:-无})"

      - name: 写 updater 发布配置片(真实公钥 + createUpdaterArtifacts + 解析版本)
        working-directory: desktop/src-tauri
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          jq -n --arg v "$MYIA_VERSION" --arg p "$PUBKEY" \
            '{version: $v, productName: "myssia", bundle: {createUpdaterArtifacts: true},
              plugins: {updater: {pubkey: $p}}}' > tauri.release.conf.json
          echo "release conf merged (version $MYIA_VERSION)"

      - name: Tauri 构建(msi;WiX 由 tauri CLI 自动下载)
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles msi --config src-tauri/tauri.release.conf.json

      # 诊断步:msi/msi-updater 目录与命名以本清单日志为准(发行资产取 updater 版,
      # 见下一步注释);glob 若与实测不符,按日志修正。
      - name: 产物清单(诊断)
        shell: bash
        run: find desktop/src-tauri/target/release/bundle -type f | sort

      # GitHub 剥非 ASCII 资产名(世事_0.0.2_x64_en-US.msi→_0.0.2_x64_en-US.msi,
      # 与 mac 的 bfb60a0 先例同款坑)→ 统一复制成 ASCII 名。发行资产取 msi-updater/
      # 的 updater 版 msi(+.sig,与 latest.json 直接同源;与常规 msi 差异仅 webview
      # 安装模式,首装同样适用)。签名按字节验证,不受改名影响。
      - name: 产物改 ASCII 名(GitHub 剥非 ASCII 资产名)
        shell: bash
        run: |
          B="desktop/src-tauri/target/release/bundle"
          cp "$B"/msi/*_x64*.msi     "$B/myssia_${MYIA_VERSION}_x64.msi"
          cp "$B"/msi/*_x64*.msi.sig "$B/myssia_${MYIA_VERSION}_x64.msi.sig"

      - name: 上传 win-msi artifact(供 release-finalize 挂 Release)
        uses: actions/upload-artifact@v4
        with:
          name: win-msi
          path: |
            desktop/src-tauri/target/release/bundle/myssia_${{ env.MYIA_VERSION }}_x64.msi
            desktop/src-tauri/target/release/bundle/myssia_${{ env.MYIA_VERSION }}_x64.msi.sig
          if-no-files-found: error

  release-finalize:
    name: 归聚(latest.json 单写者 + Windows 资产挂 Release)
    runs-on: ubuntu-latest # jq 预装(grill R2-D6a)
    needs: [macos-dmg, windows-msi]
    # mac 绿即执行(10-04-windows-build D6):windows 红/缺席不拖死 latest.json——
    # mac 条目照发,windows 仅表现为 run 红 + 条目/资产缺席(可见但不伤 mac 用户)。
    if: always() && needs.macos-dmg.result == 'success'
    steps:
      - uses: actions/checkout@v5 # tauri.conf.json 版本兜底用

      - name: 下载 mac updater 签名
        uses: actions/download-artifact@v4
        with:
          name: mac-updater
          path: dist/mac-updater

      # windows job 成功 ⟹ win-msi artifact 必在(if-no-files-found: error 保证);
      # 失败则本步跳过,latest.json 仅 mac 条目(下方 compgen 分支)。
      - name: 下载 windows msi(缺席=windows 未成功,latest.json 仅 mac 条目)
        if: needs.windows-msi.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: win-msi
          path: dist/win-msi

      # 版本解析与构建 job 同款;tag 发布时 URL 指真实 tag,dispatch 演练按未来
      # tag 形态拼(仅入 artifact 复核,不上传 Release)。
      - name: 解析版本(dispatch 入参 → tag → tauri.conf.json 兜底)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::warn::『$VERSION』非 semver(dispatch 未传 version?)——回退 tauri.conf.json 的 version。"
            VERSION="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi
          echo "MYIA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MYIA_TAG=$TAG" >> "$GITHUB_ENV"
          echo "resolved VERSION=$VERSION TAG=$TAG"

      - name: 生成 latest.json(mac 条目恒在;windows 条目按产物并入)
        env:
          REPO: ${{ github.repository }}
        run: |
          MAC_SIG="$(cat dist/mac-updater/myssia.app.tar.gz.sig)"
          jq -n --arg v "$MYIA_VERSION" --arg tag "$MYIA_TAG" --arg repo "$REPO" --arg sig "$MAC_SIG" \
            '{version: $v,
              notes: ("世事 " + $v),
              pub_date: (now | todateiso8601),
              platforms: {
                "darwin-aarch64": {
                  signature: $sig,
                  url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/myssia.app.tar.gz")
                }}}' > latest.json
          if compgen -G 'dist/win-msi/myssia_*_x64.msi' >/dev/null; then
            WIN_SIG="$(cat dist/win-msi/myssia_*_x64.msi.sig)"
            jq --arg v "$MYIA_VERSION" --arg tag "$MYIA_TAG" --arg repo "$REPO" --arg sig "$WIN_SIG" \
              '.platforms["windows-x86_64"] = {
                 signature: $sig,
                 url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/myssia_" + $v + "_x64.msi")
               }' latest.json > latest.json.tmp
            mv latest.json.tmp latest.json
          else
            echo "::warn::win-msi 产物缺席(windows job 未成功)——latest.json 仅 darwin-aarch64 条目。"
          fi
          cat latest.json

      # 无条件上传(grill R2-D6b):dispatch 验证循环里 latest.json 生成逻辑真实
      # 执行、内容可人验——最易错件的首跑不应该是主人推 tag 时。
      - name: latest.json 上传 artifact(dispatch 验证循环复核用)
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: latest.json
          if-no-files-found: error

      - name: 挂 Windows msi 到 Release(在则挂;release 已由 mac job 创建)
        if: startsWith(github.ref, 'refs/tags/') && needs.windows-msi.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/win-msi/myssia_*_x64.msi
            dist/win-msi/myssia_*_x64.msi.sig

      - name: 挂 latest.json 到 Release(单写者产出)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: latest.json
