# 构建并发布 世事 服务端镜像到 GHCR(ghcr.io/xinzhuzi/myia)。
# 仅 tag 发布:推送 v* tag 才产镜像(main 推送不产镜像,只跑 ci.yml 门禁);
# 预发布 tag(如 v1.2.0-rc.1)只出版本镜像 tag,不移动 latest。
# 与 ci.yml 刻意分离:CI 管 push/PR 测试门禁,本工作流只管发镜像。

name: Docker Publish

on:
  push:
    tags: ["v*"]
  # 手动重建历史版本镜像(如误删后恢复):dispatch 时指定 version(如 v0.0.3),
  # checkout 该 tag 构建;正式版才滚 latest(与 push 路径语义一致)。
  workflow_dispatch:
    inputs:
      version:
        description: "要重建的历史 tag(含 v 前缀,如 v0.0.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        if: ${{ !inputs.version }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 仅 semver 一条:X.Y.Z;latest 交给下方 flavor(官方语义,semver 感知预发布)。
          tags: |
            type=semver,pattern={{version}}
          # 默认即 auto,显式声明便于阅读;预发布 tag 不移动 latest——
          # v1.2.0-rc.1 只产 1.2.0-rc.1,正式版才滚动 latest。
          flavor: |
            latest=auto

      # dispatch 重建路径:checkout 的是历史 tag 但 GITHUB_REF=main,metadata-action
      # 的 semver 解析不可用——显式拼 tags(正式版滚 latest,预发布不滚,与 push 路径同语义)。
      - name: Compose tags for rebuild (dispatch)
        id: meta-rebuild
        if: ${{ inputs.version }}
        run: |
          ver="${{ inputs.version }}"
          ver="${ver#v}"
          tags="${REGISTRY}/${IMAGE_NAME}:${ver}"
          if [[ "$ver" != *"-"* ]]; then
            tags="${tags},${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "labels=" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags || steps.meta-rebuild.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || steps.meta-rebuild.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
