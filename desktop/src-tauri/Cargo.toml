[package]
name = "myssia-desktop"
version = "0.0.6"
description = "MYIA desktop — Tauri 2 shell + PyInstaller sidecar"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset(10-14-wechat-media-sns):微信聊天图片缩略图渲染前置——
# assetProtocol 开 scope 允许 $APPDATA/wechat-localdb/media-cache/**(UI 侧
# convertFileSrc 直读媒体缓存;C6 HTTP 媒体端点落地后可切端点 URL 收窄)。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
# log:统一日志面壳半(10-07-unified-logging 批2)——Rust 壳与 UI(webview
# console 劫持经 plugin JS API)同汇 `<数据根>/logs/shell.log`(按大小轮转
# KeepAll+归档名时间戳,壳启动自清 >7 天;格式沿 plugin 默认=grill 决议⑤)。
tauri-plugin-log = "2"
# dialog:看图屏系统文件选择器(拖/贴零权限,选图需插件;10-03-image-input)
tauri-plugin-dialog = "2"
# notification:sidecar 通知横幅壳代发(10-14-notify-app-icon)——desktop 走
# notify-rust,macOS set_application(bundle_id) → 图标/归组/点击唤起 = 本 app
# (osascript 直弹的脚本编辑器图标是主人报障);Rust 侧代发不经 webview ACL,
# capabilities 零新增。macOS 深链(10-15-notify-deeplink)改走 macos target
# 段的 mac-notification-sys 直发(wait_for_click 拿点击回调),插件留作非
# macOS 面。
tauri-plugin-notification = "2"
# updater:官方更新插件(签名校验 + 静默安装);process:安装后 relaunch。
# 公钥占位于 tauri.conf.json,真实公钥/签名钥仅经 CI secrets 注入(desktop/UPDATER.md)。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 壳侧 log:: 宏门面(10-07-unified-logging 批2):打点经 tauri-plugin-log
# 挂的全局 logger 落 shell.log;版本随锁内(fern/plugin 同源)0.4 线。
log = "0.4"
# 自管 Python 环境(10-05 第 2 步):依赖清单指纹;第 3 步安装链的运行时
# sha256 校验共用同 crate(design §3「下载:HTTPS + sha256 校验」)。
sha2 = "0.10"
# 安装链执行器(10-05 第 3 步,design §3):运行时下载走 reqwest 阻塞客户端
# (安装链在专用 std 线程跑,不在 tokio 上下文);TLS 与 tauri-plugin-updater
# 同栈(rustls + ring provider)不引 aws-lc-rs——rustls 直依仅用于安装
# process 级 ring provider(updater.rs 同款兜底)。tar+flate2 = install_only
# tar.gz 解压(锁内已有同版,零新增);fs2 = 磁盘余量预检。
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tar = "0.4"
flate2 = "1"
fs2 = "0.4"
# 仅用 time(请求超时);运行时由 tauri 提供,不另起 tokio 特性树。
tokio = { version = "1", features = ["time"] }
# 群信息导出缺省文件名的日期段(10-13-wechat-groupinfo R3「群信息-<显示名>
# -<日期>.json」,本地时 %Y-%m-%d);锁内已有同版 0.4.45(其他链路传递依赖),
# 零新增 crate(default-features=false,仅 clock)。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# pyenv 探测单测的临时数据根(三态/指纹/镜像回环)。
tempfile = "3"

# libc 门控必须 cfg(unix) 而非 macos-only:macOS 侧单实例锁 flock
# (10-03-single-instance)之外,壳服务组件进程组信号(pyenv_components:
# kill/pid_t/SIGTERM/SIGKILL/ESRCH,10-06-native-plugin-components)全在
# #[cfg(unix)] 块——Linux 同属 unix,CI Rust compile check 在 ubuntu 跑,
# macos-only 门控曾致 Linux 侧 libc 不链接(E0433 ×18);版本随锁内 tao 侧一致。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 静默启动让回激活用(10-03-quiet-launch):NSApp.deactivate() 抵消 tao
# 启动期无条件 activateIgnoringOtherApps(true)。版本随锁内 tao 侧一致。
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }
# 通知点击深链(10-15-notify-deeplink):wait_for_click(true) 阻塞返回
# NotificationResponse::Click —— 横幅点击后 emit notify:navigate {source}
# 给前端深链 feed 3 级目标会话。插件(notify-rust)不透传点击响应,故绕开
# 插件直用底层件(set_application 语义同插件:bundle_id 归组图标不变)。
mac-notification-sys = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 二实例唤出(10-05-win-second-instance-show):官方插件,命名
# mutex + 窗口消息——第二实例启动时回调第一实例(唤出主窗)后自退。
# macOS 是空操作且 flock 门在位,故仅 Windows 门控注册,mac 依赖树零新增。
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
