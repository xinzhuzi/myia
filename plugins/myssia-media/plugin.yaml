# myssia-media — 官方场景件:视频/频道情报(封装 yt-dlp)。
#
# 上游 yt-dlp 为 Unlicense(公域);上游以 pip 依赖形态经 uv 临时环境
# (--no-project --with yt-dlp)隔离子进程调用,**不 vendor、不复制源码**,
# 依赖不进根依赖(核心 6 依赖红线)。版本不钉:yt-dlp 抽取器时效即生命,
# 每次运行取 uv 缓存里的最新版(测试全 mock,零网络可复现)。
#
# 桌面路径(desktop 分级):`myssia media <url> --json` —— 单视频元数据或
# 频道/播放列表的扁平条目(--flat-playlist,不逐条解析媒体流,轻量快扫)。
id: myssia-media
name: 视频情报(yt-dlp)
version: 1.0.0
compatible: ">=0.0.1,<0.1"
tier: desktop
requires: []
provides: [media_intel]
adapter:
  entry: adapter.py
  mode: subprocess
modes:
  local:
    # 纯 CLI 采集件,进程内无服务形态;上游是库/CLI,无 remote endpoint。
    install: myssia plugin install plugins/myssia-media
install:
  source: https://github.com/xinzhuzi/myia.git
