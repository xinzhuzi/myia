  # Reddit 官方 Data API 通道(10-05-reddit-official-engine;链外引擎:显式
  # engine: reddit 才生效,auto 永不路过)。凭据**可选**:未配 = 显式空态
  # credential_missing(本轮零请求,写好钥匙串即恢复产出);配好即活。
  # 先决人肉步骤(主人,2026-10-31 前):reddit.com/prefs/apps 注册 script 型
  # app(redirect uri 占位 http://localhost:8080)→ myssia secret set
  # myia/reddit/client-id 与 myia/reddit/client-secret(值走 stdin)。
  # robots 面说明:oauth/www 两宿主 robots 全禁,但官方一手声明 robots.txt
  # 面向搜索引擎、不适用 Data API 授权通道 —— 引擎不查 robots(.rss/.json
  # 直抓路线仍被封死,勿动)。
