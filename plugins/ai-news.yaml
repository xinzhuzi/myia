  #   engine: reddit
  #   url: "https://oauth.reddit.com/r/MachineLearning/new"   # r/<sub>/<listing>
  #   engine_options:
  #     reddit:
  #       client_id: keychain:myia/reddit/client-id        # env:/keychain: 引用
  #       client_secret: keychain:myia/reddit/client-secret
  #       limit: 25                # 单页条目帽,1-100(缺省 25,礼貌小页)
  #       # ua_username: ~        # Reddit 条款 UA 建议含 (by /u/<name>) 段;
