# myssia-crawlab — 官方场景件:分布式爬虫管理台(封装 crawlab-team/crawlab)。
#
# 同物种例外通道(D4/D6,task 10-05-plugin-market-batch 批二):Crawlab 本身
# 就是采集编排平台,与 MYIA 同生态位 —— 盘点表原判 d 路默认不收;例外通道
# = 用户已有自部署实例要接。gate: platform 表「自有实例门槛」:激活开关落
# 全局 gates.yaml(platforms.crawlab,经 myssia gates set 或桌面设置「门槛件」
# 分区),**组织性不执法**(不拦用户 direct_api 源;开关=知情确认+plugin list
# 启用徽标+doctor info→ok),不落品类 YAML。
#
# 许可:上游 BSD-3-Clause(gh api LICENSE 原文核,2026-10-05);本插件只以
# manifest 声明依赖与文档引用接入,不复制其源码。任意已部署实例按 remote
# 接入(插件不提供 docker 模式;部署按上游官方文档,我方不复刻配方)。
id: myssia-crawlab
name: 分布式爬虫管理台(Crawlab)
version: 1.0.0
compatible: ">=0.0.1,<0.1"
tier: remote
gate: platform
requires: []
provides: [crawl_orchestration]
modes:
  remote:
    endpoint: https://crawlab.example.com   # your Crawlab deployment(占位)
    # 凭据不在 manifest 声明(本件无品类 YAML 消费,manifest endpoint 只是
    # 公开仓库占位):实际配置统一落全局 gates.yaml 的 platforms.crawlab
    # (endpoint+token),经桌面 设置→门槛件→自有实例 表单或 myssia gates set
    # 写入;凭据键规范名 myia/platforms/crawlab-token(设置面同款)。
install:
  # 复审遗留#13 注记(批二报告 4low 之四;2026-10-05 更正,task
  # 10-05-lowrisk-sweep):二次亲核 GitHub 现以 xinzhuzi/myia 为真名
  # (gh api repos/xinzhuzi/myia → full_name=xinzhuzi/myia 且无重定向来源;
  # shishi 访问被 301 解析到 myia)——本字段值=当前真名,fresh install
  # 零重定向,全仓 20 件 manifest source 同值零改动。原「统一切 shishi
  # 批末专项」作废(那会把 20 件改成别名方向)。GitNexus 索引名 shishi
  # 系索引层滞后,与远端名无关。
  source: https://github.com/xinzhuzi/myia.git
