# config/daily-digest.yaml — 跨品类合并日报(10-06-hermes-align 批次4):
# 主人截图 OCR 的 Hermes 产线版式——多品类合成**一条**飞书 markdown 文本
# 消息(msg_form: text),分区 = 品类/报表,-- 分隔线,编号一句话条目,
# 尾戳 = 生成时间 + 指纹去重 + 静默声明;全分区无新内容 = 整条静默不发。
#
# 机制(最小面):engine: store_report 链外引擎(prompt/urlwatch 判例)——
# 从 store 查本槽位窗(AM = 本地 00:00 起 / PM = 12:00 起)各品类新条目,
# 按 sections 分区渲染 Hermes 布局,整份报表 = 一条目出仓;push 模板直渲
# {{ items[0].report_markdown }}(metadata 合并,prompt 引擎同款),经
# feishu_card msg_form: text 发一条;超 4000 字由通道层按行边界续段并头尾
# 标 (i/N)(组合铁律在案,不在本层重做)。
#
# 分区匹配键 = **源名**(store items.source):分类器 category 对 builtin
# 关闭的品类(games/ai-vendor-watch)恒 None,源名是唯一稳定锚。
# dedup 锚点 = 引擎铸的 <url>#report-<YYYYMMDD>-<am|pm>(#prompt- 判例):
# 每槽一个新键,同槽重跑幂等,跨槽必新。
#
# 与既有品类路由的分工(同批降噪):ai-news/games 的 digest 路由已改
# archive(仅入库),immediate(score≥9/喜加一)保留即时;ai-vendor-watch
# 整条改 archive——本报表把窗口内全部新条目(含 immediate 已推的)合并
# 成唯一日报出口。
#
# 挂 cron 即成每日两发(错峰在采集之后;复用 cron 调度,spawn
# `myssia run` 子进程,零新调度面):
#   myssia cron create --category plugins/daily-digest.yaml \
#     --schedule "5 8,20 * * *" --db <数据根>/myssia.db

id: daily-digest
name: 每日合并日报

schedule: "5 8,20 * * *"           # 08:05 / 20:05(采集 08:00/20:00 之后)
timezone: Asia/Shanghai

sources:
  - name: daily-digest
    engine: store_report           # 链外引擎:显式选择才生效,auto 永不路过
    url: "https://myia.local/daily-digest"   # 锚 URL(仅铸 #report- 锚点用,本引擎零抓取)
    engine_options:
      store_report:
        title: AI信息
        timezone: Asia/Shanghai    # 槽位边界时区(引擎读不到品类 timezone)
        sections:
          # ── 分区一:AI 资讯(编号一句话;N. [标题](url) 链接挂标题)──
          # cocoloop 已删(2026-10-24 主人裁决 Q2):ai-news.yaml 讨论流源
          # 退役,分区一 sources 清单同步删(场景件注释铁律)。
          # labels 来源前缀映射已删(2026-10-24 D6,10-24-huawei-ai-news-absorb
          # Step 4.5):主人令「要一行富文本,不加 [] 原文等额外内容」——
          # [来源] 方括号前缀与「原文」尾注一并退役,引擎选项同步下线。
          - title: AI 日报
            sources:
              - aihot
              - aihot-daily          # aihot 三路合流之二:/daily 站方昨日回顾
              - aihot-hot            # 之三:/hot 48h 热榜(10-24-huawei-ai-
                                    # news-absorb Step 5.1;两源条目入分区一
                                    # 编号流,aihot-daily 的 X 原文直链在条目
                                    # metadata.origin_url 供渲染优先)
              - openai-news
              - deepmind-blog
              - google-research
              - microsoft-research
              - hf-blog
              - mistral-news
              - qwen-blog
              - anthropic-news-watch
              - meta-ai-blog-watch
              - cohere-blog-watch
              - zhipu-news-watch
              - moonshot-home-watch
              - minimax-home-watch
              - seed-home-watch
            max_entries: 15        # 分区条目帽(超出「另有 N 条省略」留痕)
            min_score: 3           # 价值门槛(enrich value 0-10 制):低于线不进
                                  # 正文,分区尾「另有 N 条低价值条目(价值分<3)」
                                  # 折叠留痕;无分条目不拦;口味可调,缺省不过滤
            first_run: fold        # 首轮建档折叠(2026-10-18 价值判断脚手架):
                                  # 新源第一次入库的条目不占编号席位,分区尾折
                                  # 一行「另有 N 条首轮建档条目(新源第一次入
                                  # 库,未打扰)」——配套 ai-news.yaml 的
                                  # value_gate.first_run_quiet(首跑只入库不打
                                  # 扰);缺省 show = 照常编号进正文,其他分区
                                  # 品类未开首跑抑制,保持缺省不动

          # ── 分区二:AI 厂商行情(2026-10-24 改造,10-24-huawei-ai-news-absorb
          #    D4:原「AI 厂商官网」prompt 版 2026-10-18 已静默退役,本分区
          #    改挂 vendor_market 引擎品类 ai-vendor-daily —— 股价+GPU 跨区
          #    比价+B站显卡日报视频,每日一条 #vendor-<日期> 锚条目;编号子标题
          #    + 缩进明细行,markdown 结构符剥除防飞书 md 破版式)──
          - title: AI 厂商日报
            sources: [ai-vendor-daily]
            style: detail
            max_lines: 20          # 行情整份缩进(股价+GPU 三行+视频),行帽放宽

          # ── 分区三:游戏情报(编号一句话;suffix_fields 取首个非空价格)──
          - title: 游戏喜加一与折扣
            sources: [epic-free, steam-specials, cheapshark, gog-free]
            suffix_fields: [price_text, sale_price]   # "¥0.00" / "0.00"(美元)
            max_entries: 10

          # ── 分区四:AI 白嫖与模型优惠(prompt 精筛+导航站+聚合工具发版,编号一句话;2026-10-18
          #    扩容:分区按源名匹配,新源名须同步进本清单(store items.source 锚;条目
          #    title 自描述,前缀本就未用)。2026-10-24 增挂
          #    watch-deals 三源(runninghub/hailuo/tapnow,10-24-huawei-ai-news-absorb
          #    D3 定向优惠监控:变更条目经量化门槛后入库,标题「… 官网有更新」
          #    自描述,不带前缀同规)──
          - title: AI 白嫖与优惠
            sources: [ai-token-deals, edumails-nav, freellmapi-releases, gpt4free-releases, chatall-releases, openrouter-free-pool, gonka-models, pollinations-releases, runninghub, hailuo, tapnow]
            max_entries: 10
            first_run: fold        # 首轮建档折叠(同分区一):新源第一次入库的
                                  # 条目不占编号席位,分区尾折叠留痕——配套
                                  # ai-token-deals.yaml 的 value_gate.
                                  # first_run_quiet;缺省 show 不动

          # ── 分区五:Telegram 公开频道(编号一句话;源名规约 telegram-<频道
          #    原名>,加频道时 telegram-channels.yaml 与本清单同步加一行)──
          - title: Telegram 频道
            sources: [telegram-durov]
            max_entries: 10

          # ── 分区六:Telegram 群消息(B2 出口:bot 线普通条目 archive 入库,
          #    本分区承载;高价值 ≥8 分已即时单条推出,同日报全量窗口语义
          #    再现——与 AI 资讯 immediate(score≥9)同口径,不重复即时,
          #    日报留档可回看。加群时 telegram-groups.yaml 与本清单同步加一行。
          #    双线共用(G9 决议 2026-10-08,质询回改):tg_web 线
          #    (telegram-web.yaml)源名与 bot 线同名 —— 分区按源名匹配承载
          #    两线 archive 条目;#tg- 锚命名空间独立(url 前缀+chat 形两线
          #    必不同),双线同跑同群同消息会双条,同一群建议只跑一线;
          #    tg_web 独有新群名仍同步加行)──
          - title: Telegram 群
            sources: [telegram-mihomo_party_group]
            max_entries: 10

    # 合法空集声明(gog-free 判例):全分区无新条目 = 零产出 = 静默不发,
    # 不是源退化;引擎另留 skip 哨兵(store_report_window_empty)供 doctor。
    empty_ok: true

# 报表条目不做关键词预过滤(条目本身是窗口查询产物,无标题可筛)。
classify:
  builtin: false
  rules: []

dedup:
  key: "{url}"                     # 引擎已铸 #report-<日期>-<槽位> 锚点:每槽新条目,同槽幂等

enrich:
  enabled: false                   # 报表无逐条评分面,零 token

push:
  - channel: feishu_card
    target: keychain:myia/push/FEISHU_ANALYST_OPEN_ID   # 主人 open_id(解析后 ou_ 前缀→引擎按
                                   # open_id 投递;2026-10-18 主人令「用 AI信息分析师发」,p2p
                                   # 每应用独立会话,chat_id 寻址不可跨 bot 复用故直用 open_id)
    bot: analyst                   # 出站 bot=「AI信息分析师」(FEISHU2_* 凭据位,Hermes 档案在册)
    msg_form: text                 # Hermes 日报形态:post md rows,4000 字行边界续段 (i/N)
    route:
      - when: "url != ''"          # 永真:报表跑出来即发(immediate,一条消息)
        mode: immediate
    template: |
      {{ items[0].report_markdown }}

storage:
  retention: 90d
