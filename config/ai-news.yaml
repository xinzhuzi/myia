      when: "match('Meta AI|Llama|FAIR|Yann LeCun', title)"
      tag: "Meta AI·🌍"
    # xAI(global;4 词)
    - name: tag-company-05
      when: "match('xAI|Grok|Colossus|马斯克.*Grok', title)"
      tag: "xAI·🌍"
    # Microsoft(global;5 词)
    - name: tag-company-06
      when: "match('Microsoft Copilot|微软.*AI|Azure AI|Phi-|MAI', title)"
      tag: "Microsoft·🌍"
    # NVIDIA(global;7 词)
