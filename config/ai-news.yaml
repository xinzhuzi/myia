dedup:
  key: "{url}"                  # default semantics, spelled out for clarity

enrich:
  enabled: true                 # 2026-10-18 重开:魔搭免费推理(DeepSeek-V4-Pro,Bake-off
                                # 6s/4/4 全中);原 glm-5.3-flash 云钥余额尽退役。
                                # 双引用(schema 铁律:base_url/api_key 只收
                                # env:/keychain: 引用,明文拒载 — grill Q6)
  model: deepseek-ai/DeepSeek-V4-Pro   # 魔搭免费推理(同 ai-token-deals)
  scores: [value, relevance, credibility]
  batch: 10                   # 10-03-vision-daily 实测:glm-5.3-flash 单批 20 条
                              # 评分 completion >60s 超时上限(enrich 层批级降级);
                              # 10 条留足余量,mini-batch(≤2 条)~6s 实证
  cache: true
  budget_per_run: 50000
  base_url: keychain:myia/llm/modelscope-base-url   # 魔搭免费推理(10-18 主人令;智谱钥余额耗尽切换)
                                # (值非密钥;10-03 桌面零 env 化:自 env:MYIA_LLM_BASE_URL
                                # 迁入钥匙链——桌面 sidecar 无 shell env,env: 引用会在
                                # 桌面 run 构造期 fail-fast;CLI/桌面同链录入:
                                # myssia secret set myia/llm/base_url,或桌面端凭据页)
  api_key: keychain:myia/llm/modelscope-api-key   # 既有 GLM key(与 vision.yaml cloud 同链;
                                # myssia secret set myia/image/api_key 录入)

# 价值裁决开关(2026-10-18 价值判断脚手架)。两个开关的人话与取舍:
#   first_run_quiet: 新源第一次见面,先把家底记进库,不打扰你——首跑条目
#     只入库,不进评分推送流。取舍明写:
#     · 马上要单发的条目(羊毛/优惠类,route 预演命中 immediate)不吞,
#       首轮照常单发——「宁可重发不可漏发」保住;
#     · 首轮没有评分,score≥9 型即时路由判不了,这类首跑条目进日报折叠
#       (daily-digest 的 AI 资讯分区 first_run: fold),下轮有变化再报;
#     · 只对新源/新库的首跑触发——存量源基线已在,装机后看不到它工作是
#       预期,不是开关失效。
#   repush_on_change: 同一条目内容变了(标题或正文有改动),下个时段值得
#     再报一次。存量老条目没有指纹,永不重推;只对开关开启后新入库的条目
#     生效。本源面多为 RSS(无正文),指纹退化为标题变化——编辑改标题会
#     重推,量级 = 编辑频率 × 90 天留存,接受。
# 注:aihot 一家 engine: auto,L2 命中时带首跑信号、降到 firecrawl 后无
# 标记不抑制(同源不同轮行为可能漂移,引擎面已知取舍)。
#
# 装机与验证前置(换装那天照做,私发红线在最底下):
#   ① 换装前 myssia cron 暂停本品类 + 退出桌面 app——cron 会拉起 myssia
#      run 子进程,半新半旧的代码不能跑;换装后恢复。
#   ② 要真发验证,用一份临时品类配置(私聊 open_id target + 独立 url 锚),
#      避开 08:00/20:00 采集槽位窗口,验完即删。
#   ③ 验证判据看 report.skips 里的 first_run_quiet 计数和条目的
#      fetch_change_reason 字段,不要绑 LLM 评分(评分有抖动,会污染断言)。
#   ④ 验证首跑抑制要用临时新增的源或新库——存量源的基线已经在了,不会
#      触发;装机后看不到开关工作是预期,不是开关失效。
#   私发红线:本品类生产 target 是 env:FEISHU_CHAT_ID 群——严禁对它真跑
#   推送验证;真发只走「AI信息分析师」私聊(dry-run 零推送,永远安全)。
value_gate:
  first_run_quiet: true
  repush_on_change: true

push:
  - channel: feishu_card
    target: keychain:myia/push/FEISHU_ANALYST_OPEN_ID   # 主人 open_id(ou_ 前缀→引擎按 open_id 投递;2026-10-19 主人令「全部推送用 AI信息分析师」,p2p 每应用独立会话,FEISHU_CHAT_ID 是主 bot 私聊 id 对 analyst 必 230002)
    bot: analyst               # 出站 bot=「AI信息分析师」(FEISHU2_* 凭据位,abe51b9c 同款)
    msg_form: text              # 10-06-hermes-align 批次1:日报走 markdown
                                # 文本消息(Hermes 日报形态,post md rows +
                                # 4000 字行边界拆段,经 im/v1/messages),
                                # 弃交互卡片;缺省 card 向后兼容。
    route:
      - when: "score >= 9"      # v0.2 slot: only breakout news (scored) pushes now
        mode: immediate
      - when: "category in ['freebie', 'proxy-node', 'buying-agent']"   # v0.1:
        mode: immediate         # give-aways inside AI communities go out now
      - when: "category == 'ai-news'"   # 日报层降噪(10-06-hermes-align 批次4):
        mode: archive           # 仅入库,由 plugins/daily-digest.yaml 合并日报
                                # 唯一出口收口(原 digest 槽位汇总卡退役)
      - when: "url != ''"       # 兜底封边:规则未命中的其余分类(server/token/
        mode: archive           # channel 等)同样仅入库——route 层保守缺省是
                                # digest,不封边会残留逐品类日报单发出口
                                # X 直链渲染优先(Step 5.1):aihot-daily 条目
                                # 带 metadata.origin_url(x.com/status 原文直
                                # 链)时链接挂原文而非 aihot 转述页——X 直抓
                                # 全死判例下唯一可行路径(design §6);其余源
                                # 无该字段,Jinja or 回退 item.url 零影响。
    template: |
      **AI 资讯 · {{ date }}**
      {% for item in items %}
      - [{{ item.title }}]({% if item.origin_url is defined %}{{ item.origin_url }}{% else %}{{ item.url }}{% endif %})
      {% endfor %}

storage:
  retention: 90d
  vacuum: monthly

# 图片处理环(10-03-vision-pipeline,sidecar 节):fetch 尾部对条目配图
# (aihot 卡片封面)做本地 OCR,产物进 metadata.image_ocr / image_status,
# 随 enrich 精评与推送模板即刻可读。失败只写降级标记,绝不阻断采集。
images:
  enabled: true        # OCR + 本地 VL caption(10-03-vision-daily A1:vl 实配 local)
  max_images: 3        # 每条上限;超出静默截断
  max_per_run: 30      # 每 run 硬闸(VL 时长的护栏;~30s/图,两槽合计 30 张封顶)
  min_bytes: 10240     # <10KB 视为图标/追踪像素跳过
  vl: local            # 视觉描述(情报向 caption,进 metadata.image_caption):
                       # 通道走 vision.yaml 的 local 节(设置屏「看图」录入本地
                       # 模型路径)。本地服务启动指引(mlx-vlm 示例):
                       #   uvx --from mlx-vlm mlx_vlm.server --model <模型目录> \
                       #     --host 127.0.0.1 --port 8080
                       # 服务死/超时自动降级只 OCR 不崩(已验);并发 1、45s/图
                       # 超时降级;token 计入 enrich 预算池。
  # ocr_engine: vision # vision | rapidocr;缺省按 vision.yaml 的 ocr.engine_default
