classify:                       # AI 资讯 is one of the seven builtin categories
  builtin: true                 # keyword pre-filter; unmatched titles drop
  # 公司/大V 标签库迁入(10-24-huawei-ai-news-absorb Step 5.3,AC12):
  #   数据源 = 华为云关停前快照 cloud-snapshot-20261017/{companies,influencers}
  #   .json(20 公司+22 大V,version 2026-09-24);一次性生成脚本产物固化
  #   进本文件(自包含,免新资源机制;生成=每实体 keywords 以 | 连一 match()
  #   正则,镜像生产 load_matches 的 re.compile('|'.join(words)) 逐字形态,
  #   含 马克星.*Grok/微软.*AI 等跨字距形态;大小写敏感同生产,未加 (?i))。
  #   tag = <name>·🇨🇳/🌍(region cn→🇨🇳 否则 🌍);x_accounts 字段弃用
  #   (无 X 抓取线)。规则在 builtin 存活者上打标(tags 进 metadata.tags,
  #   模板/日报可读),不救回 builtin 未命中条目。
  #   未移植(记档可翻案):大V min_score 分数门槛(白名单表达式无属性访
  #   问,scores.value 不可达)、按公司分组渲染与优先级排序(digest 层机制,
  #   design §6 后续项)、生产 max_labels=2 上限(MYIA 多 tag 并存,标题同
  #   提公司与人物时双标)。
