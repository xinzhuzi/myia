# config/weixin.yaml — 微信监控品类(10-12-weixin-feed-channel;engine:
# wechat_local,主人令翻案 G3:微信消息入情报流,与 telegram 同为一等渠道)。
#
# 机制(engine: wechat_local 链外引擎,schema 词表/registry 已注册):
#   管线进程内起本机桥子进程(受管组件 wechat-bridge 的 messages read,
#   ~/.myia/plugins/wechat-bridge 缺省落点)只读**当前打开会话**的消息区
#   (截图+OCR 像素链)→ #wx-<sha1(chat|ts|side|text)> 内容哈希锚 →
#   store 入库+dedup → feed 第四类型档(微信)。
#   ⚠ 像素链硬边界:桥不能点击切换会话(静默铁律),源声明 chat 与桥回报
#   chat.match 不符 = 结构化空态 chat_not_open(不张冠李戴)—— 想采哪个
#   会话,就在微信里把那个会话打开着。
#
# 锚的如实限制(与 #tg-<chat>-<mid> 全期强幂等不可比):像素链没有消息 id,
#   锚只能内容铸 —— OCR 修字/置信度波动使文本微变会另立新锚(重复条目靠
#   feed 读态消化);ts 标记间歇出现,缺失段内同文本同侧消息会并锚。
#
# 前置(一次性):设置安装 wechat-bridge 组件(前置 brew install sqlcipher)
#   + 授屏幕录制权限 + 微信桌面客户端保持登录、目标会话保持打开。
#
# 缺省关(隐私面,telegram-web.yaml「未挂 cron」同款先例):本文件在场 ≠
#   在跑 —— 品类只在注册了 cron job(桌面排程/myssia cron)后才拉取;
#   微信是主人隐私面,显式开启才采。
#
# 私有数据红线:enrich 关(内容不出本机不送 LLM)+ push 空(不外发任何
#   通道)+ 日报无微信分区;条目只入本机 store+feed。retention 30d 隐私
#   谨慎缺省(TG 90d;敏感会话可单源改短,反之也可调长)。

id: weixin
name: 微信监控

schedule: "*/30 * * * *"          # 批量档窗口读取(镜像 TG web 线节奏)
timezone: Asia/Shanghai

# 品类级 fetch 阶段超时帽(秒):单源一次桥读 = 全窗截图 + 两遍 OCR(+可选
# VL 校字),60s 命令族上界外再留余量;品类帽须 ≥ 源级
# engine_options.wechat_local.read_timeout_seconds。
timeouts:
  fetch: 120

sources:
  # ── 首源样例:文件传输助手(每个微信账号都有,零隐私面,先验通链路;
  #    想监控真实会话 = 照此形态加源,并把那个会话在微信里保持打开)──
  - name: weixin-文件传输助手     # 源名全称律:weixin-<会话原名>(feed 渠道名/L2 行/去重匹配键)
    engine: wechat_local
    url: "https://weixin.qq.com"  # 锚(schema http(s) 形状要求;引擎零 HTTP,端点=本机桥)
    empty_ok: true                # 当前会话不匹配/窗口零消息 = 合法空(doctor 口径)
    engine_options:
      wechat_local:
        chat: "文件传输助手"      # 与像素链可见标题匹配(同桥 messages read 的 id)
        count: 50                 # 最近 K 条,1-200(窗口现存,不滚动翻历史)
        sides: [left]             # 采集侧:left=对方(缺省)/right=自己/center=系统行
        read_timeout_seconds: 60  # 单次桥读上界(截图+OCR;须 ≤ 品类 timeouts.fetch)
    rate_limit: {qps: 0.5, jitter: "2s", backoff: exponential, respect_robots: true}
    proxy: direct                 # 零 HTTP;robots 面不适用(本机像素读回)
    retry: 1                      # 本机桥读,重试 1 防截图重打

  # ── 你的会话往这里加(一个会话一个源;桥不能切会话,同轮多源 = 重复读
  #    同一窗口,像素链只出「当前打开会话」的载荷 —— 多源各配各 chat,
  #    不匹配的源按空态跳过,如实)──

# 首版全入库,筛选交给 feed 读态/星标(零 LLM 筛选:私有内容不出本机)。
watchlist:
  keywords: []
  mute: []

classify:
  builtin: false
  rules: []

dedup:
  key: "{url}"                    # #wx- 内容哈希锚全串(同窗重读同消息 → 同锚 → 沉默)

enrich:
  enabled: false                  # 红线:私有内容不出本机(不送 LLM)

push: []                          # 红线:不外发任何通道;条目只入 store+feed

storage:
  retention: 30d                  # 隐私谨慎缺省(TG 90d;敏感会话可单源改短)
  vacuum: monthly
