# 上游 koala73/worldmonitor(AGPL-3.0)官方 compose 的等价薄封装。上游无预
# 构建镜像,四服务(app+ais-relay+redis+redis-rest)照上游 quickstart 从上游
# git 构建,build 上下文钉 tag v2.10.0(#v2.10.0;redis-rest 的 Dockerfile 在
# 仓库 docker/ 子目录,用 #tag:docker 片段语法)——AGPL 只桩不抄:本仓库零
# 上游源码,构建产物义务留在上游侧。本文件零明文凭据:上游四个必设密钥经
# ${VAR} 注入(REDIS_TOKEN/WM_SESSION_SECRET/RELAY_SHARED_SECRET/REDIS_
# PASSWORD,生成:openssl rand -hex 32),可选数据源/LLM 键同经注入。
# 用法:docker compose up -d --build 后,实例地址 http://127.0.0.1:3001 填进
# 桌面 设置→门槛件→自有实例 表单(落 gates.yaml platforms.worldmonitor.
# endpoint,容器内口=上游 8080),并知情开启门槛开关:
# myssia gates set platforms.worldmonitor on;实例侧操作键(WORLDMONITOR_
# VALID_KEYS / X-WorldMonitor-Key)经 ${WORLDMONITOR_VALID_KEYS} 注入自配,
# MYIA 门槛面不设凭据位(设置面 hasToken=false)。
services:
  worldmonitor:
    build:
      context: https://github.com/koala73/worldmonitor.git#v2.10.0
      dockerfile: Dockerfile
    image: worldmonitor:latest
    container_name: myssia-worldmonitor
    ports:
      # web-check 已占 3000,这里让一位到 3001(容器内口=上游 8080);
      # 默认只绑回环,要远程访问走自有反代/TLS。
      - "127.0.0.1:3001:8080"
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — openssl rand -hex 32}"
      WM_SESSION_SECRET: "${WM_SESSION_SECRET:?WM_SESSION_SECRET required — openssl rand -hex 32}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
      # 操作键(REST/MCP 经 X-WorldMonitor-Key 透传;留空=实例不启用键鉴权)。
      WORLDMONITOR_VALID_KEYS: "${WORLDMONITOR_VALID_KEYS:-}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required — openssl rand -hex 32}"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
    depends_on:
      - redis-rest
      - ais-relay
    restart: unless-stopped

  ais-relay:
    build:
      context: https://github.com/koala73/worldmonitor.git#v2.10.0
      dockerfile: Dockerfile.relay
    image: worldmonitor-ais-relay:latest
    container_name: myssia-worldmonitor-ais-relay
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required — openssl rand -hex 32}"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — openssl rand -hex 32}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      PORT: "3004"
      API_BASE_URL: "${API_BASE_URL:-http://worldmonitor:8080}"
      # 可选数据源键(AIS 船位/行情;缺省优雅降级,上游语义)。
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
    depends_on:
      - redis-rest
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: myssia-worldmonitor-redis
    # --requirepass 关网面:任何未来加入网络的 sidecar/被攻陷依赖都读不到
    # 缓存条目(与上游一致的纵深防御)。
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required — openssl rand -hex 32}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - worldmonitor-redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: https://github.com/koala73/worldmonitor.git#v2.10.0:docker
      dockerfile: Dockerfile.redis-rest
    image: worldmonitor-redis-rest:latest
    container_name: myssia-worldmonitor-redis-rest
    mem_limit: 512m
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — openssl rand -hex 32}"
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required — openssl rand -hex 32}@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  worldmonitor-redis-data:
