# 上游 crawlab-team/crawlab(BSD-3-Clause)官方镜像官方 quickstart 的等价薄
# 封装:master+mongo 两服务(CRAWLAB_NODE_MASTER/CRAWLAB_MONGO_HOST 与上游
# 部署 compose 同参)。本文件零明文凭据——Crawlab 鉴权在实例侧(登录 JWT;
# 部署侧启用 API token/反代鉴权时,凭据走门槛规范键 myia/platforms/crawlab-token)。
# 用法:docker compose up -d 后,实例地址 http://127.0.0.1:8080 填进桌面
# 设置→门槛件→自有实例 表单(落 gates.yaml platforms.crawlab.endpoint),
# 并知情开启门槛开关:myssia gates set platforms.crawlab on(自有实例例外
# 通道,组织性不执法)。
services:
  master:
    image: crawlabteam/crawlab
    container_name: myssia-crawlab-master
    environment:
      CRAWLAB_NODE_MASTER: "Y"
      CRAWLAB_MONGO_HOST: "mongo"
    ports:
      # 默认只绑回环(自部署零第三方;要远程访问走自有反代/TLS,不开公网裸端口)。
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo
    restart: unless-stopped

  # 元数据库(上游 quickstart 同款 mongo:4.2;数据卷持久化)。
  mongo:
    image: mongo:4.2
    container_name: myssia-crawlab-mongo
    volumes:
      - crawlab-mongo-data:/data/db
    restart: unless-stopped

volumes:
  crawlab-mongo-data:
