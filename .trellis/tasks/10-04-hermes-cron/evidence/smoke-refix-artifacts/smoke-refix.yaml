id: smoke-refix
name: 复查冒烟
schedule: "0 9,21 * * *"
timezone: Asia/Shanghai
sources:
  - name: local-fixture
    engine: static_html
    url: "http://127.0.0.1:8801/index.html"
    extract:
      type: list
      item: "article.post"
      fields:
        title: "h2 a"
        url: "h2 a@href"
classify:
  builtin: false
  rules: []

dedup:
  key: "{url}"
push:
  - channel: stdout
storage:
  retention: 30d
